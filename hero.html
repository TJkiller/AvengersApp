<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Hero</title>
  <link rel="stylesheet" href="stylesTwo.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div id="menu">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="index.html#about"><i class="fas fa-info-circle"></i> About Us</a>
    <a href="index.html#contact"><i class="fas fa-envelope"></i> Contact</a>
  </div>

  <div class="hero-container" id="hero-container">
    <div id="loading" style="text-align:center; padding: 60px;">
      <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: #ED1D24;"></i>
      <p>Loading hero...</p>
    </div>

    <div id="error" style="display:none; text-align:center; padding: 60px;">
      <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ED1D24;"></i>
      <h2>Hero Not Found</h2>
      <a href="index.html" style="display:inline-block; margin-top: 20px; padding: 12px 30px; background: #ED1D24; color: white; border-radius: 50px;">Go Home</a>
    </div>

    <div id="hero-content" style="display:none;">
      <div class="hero-header">
        <h2 class="hero-name" id="hero-title"></h2>
      </div>

      <div class="hero-content">
        <div class="hero-image">
          <img id="hero-image" src="" alt="">
        </div>

        <div class="hero-details">
          <div class="bio-section">
            <h4><i class="fas fa-user"></i> Bio</h4>
            <p><strong>Full Name:</strong> <span id="bio-fullName"></span></p>
            <p><strong>Place of Birth:</strong> <span id="bio-placeOfBirth"></span></p>
            <p><strong>Alignment:</strong> <span id="bio-alignment"></span></p>
            <p><strong>Gender:</strong> <span id="bio-gender"></span></p>
            <p><strong>Race:</strong> <span id="bio-race"></span></p>
          </div>

          <div class="stats-section">
            <h4><i class="fas fa-chart-line"></i> Power Stats</h4>
            <p><strong>Intelligence:</strong> <span class="stat-value" id="stat-intelligence"></span><span class="stat-bar"><span class="stat-fill" id="fill-intelligence"></span></span></p>
            <p><strong>Strength:</strong> <span class="stat-value" id="stat-strength"></span><span class="stat-bar"><span class="stat-fill" id="fill-strength"></span></span></p>
            <p><strong>Speed:</strong> <span class="stat-value" id="stat-speed"></span><span class="stat-bar"><span class="stat-fill" id="fill-speed"></span></span></p>
            <p><strong>Durability:</strong> <span class="stat-value" id="stat-durability"></span><span class="stat-bar"><span class="stat-fill" id="fill-durability"></span></span></p>
            <p><strong>Power:</strong> <span class="stat-value" id="stat-power"></span><span class="stat-bar"><span class="stat-fill" id="fill-power"></span></span></p>
            <p><strong>Combat:</strong> <span class="stat-value" id="stat-combat"></span><span class="stat-bar"><span class="stat-fill" id="fill-combat"></span></span></p>
          </div>
        </div>
      </div>

      <div class="next-btn" id="next-btn"></div>
    </div>
  </div>

  <footer>
    <p>2025 Marvel Gallery | Created by TJ Killer</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://zxhubiaitwrkyxoiojei.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4aHViaWFpdHdya3l4b2lvamVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTY2ODksImV4cCI6MjA5MzU3MjY4OX0.4v-vO3JA2jAU1ItSRHFOoZDfAjHEFmkuiPhDBy7ljiU';

    const params = new URLSearchParams(window.location.search);
    const heroId = params.get('id');

    if (!heroId) {
      showError();
    } else {
      loadHero(heroId);
    }

    async function loadHero(id) {
      try {
        // Get current hero
        const res = await fetch(`${SUPABASE_URL}/rest/v1/heroes?id=eq.${id}&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          }
        });
        const heroes = await res.json();
        
        if (!heroes || heroes.length === 0) {
          showError();
          return;
        }
        
        const hero = heroes[0];
        
        // Get ALL heroes to find next one based on display_order
        const allRes = await fetch(`${SUPABASE_URL}/rest/v1/heroes?select=id,name,display_order&order=display_order.asc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          }
        });
        const allHeroes = await allRes.json();
        
        // Find next hero (higher display_order)
        let nextHero = null;
        const currentIndex = allHeroes.findIndex(h => h.id === hero.id);
        if (currentIndex !== -1 && currentIndex < allHeroes.length - 1) {
          nextHero = allHeroes[currentIndex + 1];
        }
        
        buildPage(hero, nextHero);
        
      } catch (err) {
        console.error(err);
        showError();
      }
    }

    function buildPage(hero, nextHero) {
      document.title = hero.name + ' - Marvel Hero';
      document.body.className = hero.theme || '';
      
      document.getElementById('hero-title').innerHTML = `<i class="${hero.icon || 'fas fa-star'}"></i> ${hero.name}`;
      
      const img = document.getElementById('hero-image');
      img.src = hero.image;
      img.alt = hero.name;
      img.onerror = () => { img.src = 'https://placehold.co/400x400/1e1e1e/666?text=' + hero.name; };
      
      document.getElementById('bio-fullName').textContent = hero.bio_fullname || 'Unknown';
      document.getElementById('bio-placeOfBirth').textContent = hero.bio_placeofbirth || 'Unknown';
      document.getElementById('bio-alignment').textContent = hero.bio_alignment || 'Good';
      document.getElementById('bio-gender').textContent = hero.bio_gender || 'Unknown';
      document.getElementById('bio-race').textContent = hero.bio_race || 'Unknown';
      
      const stats = ['intelligence', 'strength', 'speed', 'durability', 'power', 'combat'];
      stats.forEach(stat => {
        const value = hero['stat_' + stat] || 50;
        document.getElementById('stat-' + stat).textContent = value + '%';
        setTimeout(() => {
          document.getElementById('fill-' + stat).style.width = value + '%';
        }, 100);
      });
      
      const nextBtn = document.getElementById('next-btn');
      if (nextHero) {
        nextBtn.innerHTML = `<a href="hero.html?id=${nextHero.id}"><i class="fas fa-arrow-right"></i> Next: ${nextHero.name}</a>`;
      } else {
        nextBtn.innerHTML = `<a href="index.html"><i class="fas fa-home"></i> Return Home</a>`;
      }
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('hero-content').style.display = 'block';
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
